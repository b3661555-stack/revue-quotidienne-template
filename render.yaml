# Render Blueprint for Chatdex (https://render.com/docs/blueprint-spec).
# Render → New → Blueprint → pick this repository. SQLite and photos live on the persistent disk,
# which requires a paid instance type (Starter).
services:
  - type: web
    name: chatdex
    runtime: node
    rootDir: chatdex
    plan: starter
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: chatdex-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: DATA_DIR
        value: /var/data
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_DATA
        value: "true"
      - key: CORS_ORIGINS
        value: capacitor://localhost,https://localhost,http://localhost
